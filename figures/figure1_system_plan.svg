<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 828" width="960" height="828" role="img" aria-labelledby="fig-title">
  <title id="fig-title">System plan: each month, a set of repositories is split into per-repo steps, merged into one diversity score, and a trend test runs across all 60 months</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5566"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1f2a37; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .muted { font-size: 13px; fill: #5b6675; }
      .check { font-size: 13px; fill: #2e7d4f; font-weight: 600; }
      .out-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; fill: #8a94a3; }
      .out { font-size: 13.5px; font-weight: 600; }
      .note { font-size: 12px; fill: #5b6675; font-style: italic; }
      .tick { font-size: 12px; fill: #5b6675; }
      .chart-label { font-size: 12.5px; font-weight: 600; }
      .badge { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .pill { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; fill: #ffffff; }
      .card { fill: #e9f0f8; stroke: #9fb6cf; stroke-width: 1.2; }
      .chip-box { fill: #ffffff; stroke: #c9d1db; stroke-width: 1; }
      .flow { stroke: #4a5566; stroke-width: 1.6; fill: none; }
      .dot { fill: #5b6675; }
    </style>
  </defs>

  <rect width="960" height="828" fill="#ffffff"/>

  <!-- Month frame, stacked to show repetition -->
  <rect x="22" y="36" width="936" height="484" rx="10" fill="#ffffff" stroke="#d5dbe3"/>
  <rect x="16" y="30" width="936" height="484" rx="10" fill="#ffffff" stroke="#c9d1db"/>
  <rect x="10" y="24" width="936" height="484" rx="10" fill="#ffffff" stroke="#8a94a3" stroke-width="1.4"/>
  <rect x="26" y="12" width="118" height="24" rx="12" fill="#1f2a37"/>
  <text class="pill" x="85" y="28.5" text-anchor="middle">EACH MONTH t</text>
  <rect x="150" y="16" width="242" height="16" fill="#ffffff"/>
  <text class="muted" x="154" y="28.5">60 months, Jan 2021 &#8211; Dec 2025</text>

  <!-- Repo frame, stacked to show repetition -->
  <rect x="254" y="82" width="460" height="416" rx="10" fill="#ffffff" stroke="#d5dbe3"/>
  <rect x="249" y="77" width="460" height="416" rx="10" fill="#ffffff" stroke="#c9d1db"/>
  <rect x="244" y="72" width="460" height="416" rx="10" fill="#ffffff" stroke="#2f5d8c" stroke-width="1.4"/>
  <rect x="258" y="60" width="100" height="24" rx="12" fill="#2f5d8c"/>
  <text class="pill" x="308" y="76.5" text-anchor="middle">EACH REPO</text>

  <!-- Rejection loop: Filter back to the set -->
  <path d="M588,96 V50 H114 V94" fill="none" stroke="#8a94a3" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <rect x="236" y="42" width="232" height="15" fill="#ffffff"/>
  <text class="note" x="352" y="54" text-anchor="middle">rejected &#8594; draw next repo from set</text>

  <!-- 1 Sample (whole set) -->
  <g>
    <rect class="card" x="24" y="96" width="180" height="376" rx="8"/>
    <circle cx="46" cy="122" r="12" fill="#2f5d8c"/>
    <text class="badge" x="46" y="126.5" text-anchor="middle">1</text>
    <text class="title" x="66" y="128">Sample</text>
    <circle class="dot" cx="44" cy="147" r="2"/><text class="body" x="54" y="152">Collect repos created</text>
    <text class="body" x="54" y="170">in month t</text>
    <circle class="dot" cx="44" cy="187" r="2"/><text class="body" x="54" y="192">Deduplicate by ID</text>
    <circle class="dot" cx="44" cy="207" r="2"/><text class="body" x="54" y="212">Shuffle (set seed)</text>
    <rect x="40" y="232" width="148" height="150" rx="8" fill="#ffffff" stroke="#9fb6cf" stroke-dasharray="4 3"/>
    <g fill="#ffffff" stroke="#9fb6cf" stroke-width="1.2">
      <rect x="53" y="246" width="20" height="20" rx="3"/><rect x="87" y="246" width="20" height="20" rx="3"/><rect x="121" y="246" width="20" height="20" rx="3"/><rect x="155" y="246" width="20" height="20" rx="3"/>
      <rect x="53" y="280" width="20" height="20" rx="3"/><rect x="87" y="280" width="20" height="20" rx="3"/><rect x="121" y="280" width="20" height="20" rx="3"/><rect x="155" y="280" width="20" height="20" rx="3"/>
      <rect x="53" y="314" width="20" height="20" rx="3"/><rect x="87" y="314" width="20" height="20" rx="3"/><rect x="121" y="314" width="20" height="20" rx="3"/><rect x="155" y="314" width="20" height="20" rx="3"/>
      <rect x="53" y="348" width="20" height="20" rx="3"/><rect x="87" y="348" width="20" height="20" rx="3"/><rect x="121" y="348" width="20" height="20" rx="3"/><rect x="155" y="348" width="20" height="20" rx="3"/>
    </g>
    <rect class="chip-box" x="36" y="430" width="156" height="24" rx="5"/>
    <text class="out-tag" x="46" y="445.5">OUTPUT</text>
    <text class="out" x="96" y="446.5">Repo set</text>
  </g>

  <!-- Split: set into individual repos -->
  <line class="flow" x1="206" y1="176" x2="256" y2="158" marker-end="url(#arrow)"/>
  <line class="flow" x1="206" y1="176" x2="256" y2="176" marker-end="url(#arrow)"/>
  <line class="flow" x1="206" y1="176" x2="256" y2="194" marker-end="url(#arrow)"/>

  <!-- 2 Retrieve -->
  <g>
    <rect class="card" x="258" y="96" width="200" height="160" rx="8"/>
    <circle cx="280" cy="122" r="12" fill="#2f5d8c"/>
    <text class="badge" x="280" y="126.5" text-anchor="middle">2</text>
    <text class="title" x="300" y="128">Retrieve</text>
    <circle class="dot" cx="278" cy="147" r="2"/><text class="body" x="288" y="152">Last commit by day 30</text>
    <circle class="dot" cx="278" cy="167" r="2"/><text class="body" x="288" y="172">Save README, file tree,</text>
    <text class="body" x="288" y="190">and dependencies</text>
    <rect class="chip-box" x="270" y="220" width="176" height="24" rx="5"/>
    <text class="out-tag" x="280" y="235.5">OUTPUT</text>
    <text class="out" x="330" y="236.5">Repo at day 30</text>
  </g>
  <line class="flow" x1="458" y1="176" x2="486" y2="176" marker-end="url(#arrow)"/>

  <!-- 3 Filter -->
  <g>
    <rect class="card" x="488" y="96" width="200" height="160" rx="8"/>
    <circle cx="510" cy="122" r="12" fill="#2f5d8c"/>
    <text class="badge" x="510" y="126.5" text-anchor="middle">3</text>
    <text class="title" x="530" y="128">Filter</text>
    <text class="muted" x="504" y="152">Reject if:</text>
    <circle class="dot" cx="508" cy="167" r="2"/><text class="body" x="518" y="172">Fork or empty</text>
    <circle class="dot" cx="508" cy="187" r="2"/><text class="body" x="518" y="192">Template or tutorial</text>
    <circle class="dot" cx="508" cy="207" r="2"/><text class="body" x="518" y="212">Not in English</text>
    <rect class="chip-box" x="500" y="220" width="176" height="24" rx="5"/>
    <text class="out-tag" x="510" y="235.5">OUTPUT</text>
    <text class="out" x="560" y="236.5">Keep or reject</text>
  </g>

  <path class="flow" d="M588,256 V274 H358 V290" marker-end="url(#arrow)"/>

  <!-- 4 Summarize -->
  <g>
    <rect class="card" x="258" y="292" width="200" height="180" rx="8"/>
    <circle cx="280" cy="318" r="12" fill="#2f5d8c"/>
    <text class="badge" x="280" y="322.5" text-anchor="middle">4</text>
    <text class="title" x="300" y="324">Summarize</text>
    <circle class="dot" cx="278" cy="343" r="2"/><text class="body" x="288" y="348">LLM reads saved files</text>
    <circle class="dot" cx="278" cy="363" r="2"/><text class="body" x="288" y="368">States purpose, users</text>
    <circle class="dot" cx="278" cy="383" r="2"/><text class="body" x="288" y="388">No dates or owners</text>
    <text class="check" x="274" y="416">&#10003; 50 checked by hand</text>
    <rect class="chip-box" x="270" y="430" width="176" height="24" rx="5"/>
    <text class="out-tag" x="280" y="445.5">OUTPUT</text>
    <text class="out" x="330" y="446.5">Idea summary</text>
  </g>
  <line class="flow" x1="458" y1="382" x2="486" y2="382" marker-end="url(#arrow)"/>

  <!-- 5 Embed -->
  <g>
    <rect class="card" x="488" y="292" width="200" height="180" rx="8"/>
    <circle cx="510" cy="318" r="12" fill="#2f5d8c"/>
    <text class="badge" x="510" y="322.5" text-anchor="middle">5</text>
    <text class="title" x="530" y="324">Embed</text>
    <circle class="dot" cx="508" cy="343" r="2"/><text class="body" x="518" y="348">Summary &#8594; vector</text>
    <circle class="dot" cx="508" cy="363" r="2"/><text class="body" x="518" y="368">Similar ideas &#8594; close</text>
    <text class="check" x="504" y="416">&#10003; 50 pairs vs. humans</text>
    <rect class="chip-box" x="500" y="430" width="176" height="24" rx="5"/>
    <text class="out-tag" x="510" y="445.5">OUTPUT</text>
    <text class="out" x="560" y="446.5">One vector</text>
  </g>

  <!-- Merge: kept repos back into one set -->
  <line class="flow" x1="690" y1="364" x2="746" y2="382"/>
  <line class="flow" x1="690" y1="382" x2="748" y2="382" marker-end="url(#arrow)"/>
  <line class="flow" x1="690" y1="400" x2="746" y2="382"/>

  <!-- 6 Score (whole set) -->
  <g>
    <rect class="card" x="750" y="96" width="180" height="376" rx="8"/>
    <circle cx="772" cy="122" r="12" fill="#2f5d8c"/>
    <text class="badge" x="772" y="126.5" text-anchor="middle">6</text>
    <text class="title" x="792" y="128">Score</text>
    <circle class="dot" cx="770" cy="147" r="2"/><text class="body" x="780" y="152">Merge all vectors</text>
    <circle class="dot" cx="770" cy="167" r="2"/><text class="body" x="780" y="172">Average distance</text>
    <text class="body" x="780" y="190">over all pairs</text>
    <rect x="766" y="212" width="148" height="58" rx="5" fill="#ffffff" stroke="#c9d1db"/>
    <g fill="#2f5d8c">
      <circle cx="834" cy="239" r="3"/><circle cx="842" cy="243" r="3"/><circle cx="837" cy="248" r="3"/><circle cx="846" cy="236" r="3"/>
      <circle cx="830" cy="246" r="3"/><circle cx="841" cy="251" r="3"/><circle cx="848" cy="247" r="3"/><circle cx="833" cy="234" r="3"/>
    </g>
    <text class="tick" x="840" y="288" text-anchor="middle">alike = low</text>
    <rect x="766" y="302" width="148" height="58" rx="5" fill="#ffffff" stroke="#c9d1db"/>
    <g fill="#2f5d8c">
      <circle cx="780" cy="314" r="3"/><circle cx="820" cy="310" r="3"/><circle cx="900" cy="318" r="3"/><circle cx="800" cy="333" r="3"/>
      <circle cx="860" cy="329" r="3"/><circle cx="776" cy="349" r="3"/><circle cx="838" cy="349" r="3"/><circle cx="904" cy="345" r="3"/>
    </g>
    <text class="tick" x="840" y="378" text-anchor="middle">varied = high</text>
    <rect class="chip-box" x="762" y="430" width="156" height="24" rx="5"/>
    <text class="out-tag" x="772" y="445.5">OUTPUT</text>
    <text class="out" x="822" y="446.5">One score</text>
  </g>

  <!-- Monthly scores leave the frame -->
  <line class="flow" x1="840" y1="472" x2="840" y2="562" marker-end="url(#arrow)"/>
  <rect x="848" y="530" width="108" height="18" fill="#ffffff"/>
  <text class="note" x="852" y="543">60 monthly scores</text>

  <!-- 7 Trend test -->
  <g transform="translate(64 14)">
    <rect class="card" x="300" y="550" width="566" height="250" rx="8"/>
    <circle cx="322" cy="576" r="12" fill="#2f5d8c"/>
    <text class="badge" x="322" y="580.5" text-anchor="middle">7</text>
    <text class="title" x="342" y="582">Trend test</text>
    <text class="note" x="852" y="581" text-anchor="end">illustration, not results</text>

    <line x1="336" y1="738" x2="846" y2="738" stroke="#8a94a3"/>
    <line x1="336" y1="612" x2="336" y2="738" stroke="#8a94a3"/>
    <text class="tick" transform="translate(326 680) rotate(-90)" text-anchor="middle">diversity &#8593;</text>
    <g class="tick" text-anchor="middle">
      <line x1="340" y1="738" x2="340" y2="742" stroke="#8a94a3"/><text x="340" y="754">2021</text>
      <line x1="441.7" y1="738" x2="441.7" y2="742" stroke="#8a94a3"/><text x="441.7" y="754">2022</text>
      <line x1="543.4" y1="738" x2="543.4" y2="742" stroke="#8a94a3"/><text x="543.4" y="754">2023</text>
      <line x1="645.1" y1="738" x2="645.1" y2="742" stroke="#8a94a3"/><text x="645.1" y="754">2024</text>
      <line x1="746.8" y1="738" x2="746.8" y2="742" stroke="#8a94a3"/><text x="746.8" y="754">2025</text>
    </g>

    <line x1="530.7" y1="612" x2="530.7" y2="738" stroke="#b03a2e" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text class="chart-label" x="530.7" y="607" text-anchor="middle" style="fill:#b03a2e">ChatGPT release</text>

    <g fill="#8a94a3" transform="translate(0 -10)">
      <circle cx="340.0" cy="667.4" r="2.6"/><circle cx="348.5" cy="667.5" r="2.6"/><circle cx="356.9" cy="671.4" r="2.6"/><circle cx="365.4" cy="669.0" r="2.6"/><circle cx="373.9" cy="667.1" r="2.6"/><circle cx="382.4" cy="668.5" r="2.6"/><circle cx="390.8" cy="671.2" r="2.6"/><circle cx="399.3" cy="667.5" r="2.6"/><circle cx="407.8" cy="665.2" r="2.6"/><circle cx="416.3" cy="658.7" r="2.6"/><circle cx="424.7" cy="661.9" r="2.6"/><circle cx="433.2" cy="660.3" r="2.6"/><circle cx="441.7" cy="660.7" r="2.6"/><circle cx="450.2" cy="661.6" r="2.6"/><circle cx="458.6" cy="663.6" r="2.6"/><circle cx="467.1" cy="670.8" r="2.6"/><circle cx="475.6" cy="668.8" r="2.6"/><circle cx="484.1" cy="666.6" r="2.6"/><circle cx="492.5" cy="664.0" r="2.6"/><circle cx="501.0" cy="655.4" r="2.6"/><circle cx="509.5" cy="654.6" r="2.6"/><circle cx="518.0" cy="656.8" r="2.6"/><circle cx="526.4" cy="657.9" r="2.6"/>
      <circle cx="534.9" cy="701.5" r="2.6"/><circle cx="543.4" cy="704.1" r="2.6"/><circle cx="551.9" cy="698.5" r="2.6"/><circle cx="560.3" cy="705.4" r="2.6"/><circle cx="568.8" cy="706.9" r="2.6"/><circle cx="577.3" cy="705.0" r="2.6"/><circle cx="585.8" cy="700.6" r="2.6"/><circle cx="594.2" cy="701.8" r="2.6"/><circle cx="602.7" cy="696.3" r="2.6"/><circle cx="611.2" cy="703.6" r="2.6"/><circle cx="619.7" cy="702.7" r="2.6"/><circle cx="628.1" cy="700.3" r="2.6"/><circle cx="636.6" cy="699.6" r="2.6"/><circle cx="645.1" cy="708.0" r="2.6"/><circle cx="653.6" cy="706.9" r="2.6"/><circle cx="662.0" cy="711.8" r="2.6"/><circle cx="670.5" cy="712.3" r="2.6"/><circle cx="679.0" cy="708.6" r="2.6"/><circle cx="687.5" cy="706.5" r="2.6"/><circle cx="695.9" cy="706.7" r="2.6"/><circle cx="704.4" cy="703.3" r="2.6"/><circle cx="712.9" cy="699.4" r="2.6"/><circle cx="721.4" cy="700.7" r="2.6"/><circle cx="729.8" cy="706.6" r="2.6"/><circle cx="738.3" cy="700.6" r="2.6"/><circle cx="746.8" cy="703.0" r="2.6"/><circle cx="755.3" cy="711.1" r="2.6"/><circle cx="763.7" cy="709.4" r="2.6"/><circle cx="772.2" cy="712.7" r="2.6"/><circle cx="780.7" cy="711.9" r="2.6"/><circle cx="789.2" cy="709.4" r="2.6"/><circle cx="797.6" cy="714.3" r="2.6"/><circle cx="806.1" cy="704.6" r="2.6"/><circle cx="814.6" cy="705.6" r="2.6"/><circle cx="823.1" cy="703.2" r="2.6"/><circle cx="831.5" cy="708.4" r="2.6"/><circle cx="840.0" cy="706.6" r="2.6"/>
    </g>

    <g transform="translate(0 -10)">
      <line x1="340" y1="670" x2="526.4" y2="659" stroke="#2f5d8c" stroke-width="2.2"/>
      <line x1="530.7" y1="658.8" x2="840" y2="640.5" stroke="#2f5d8c" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.7"/>
      <line x1="534.9" y1="700" x2="840" y2="710.8" stroke="#2f5d8c" stroke-width="2.2"/>
      <text class="note" x="640" y="640">if nothing changed</text>
      <line x1="539" y1="658" x2="539" y2="700" stroke="#1f2a37" stroke-width="1.3"/>
      <line x1="535" y1="658" x2="543" y2="658" stroke="#1f2a37" stroke-width="1.3"/>
      <line x1="535" y1="700" x2="543" y2="700" stroke="#1f2a37" stroke-width="1.3"/>
      <text class="chart-label" x="550" y="683">&#946;&#8322; jump</text>
      <text class="chart-label" x="728" y="736">&#946;&#8323; slope change</text>
    </g>

    <rect class="chip-box" x="312" y="764" width="542" height="24" rx="5"/>
    <text class="out-tag" x="322" y="779.5">OUTPUT</text>
    <text class="out" x="372" y="780.5">&#946;&#8322; and &#946;&#8323;, each with a 95% confidence interval</text>
  </g>

  <line class="flow" x1="364" y1="689" x2="330" y2="689" marker-end="url(#arrow)"/>

  <!-- 8 Robustness -->
  <g>
    <rect class="card" x="24" y="564" width="304" height="250" rx="8"/>
    <circle cx="46" cy="590" r="12" fill="#2f5d8c"/>
    <text class="badge" x="46" y="594.5" text-anchor="middle">8</text>
    <text class="title" x="66" y="596">Robustness</text>
    <text class="muted" x="40" y="626">Rerun step 7:</text>
    <circle class="dot" cx="44" cy="649" r="2"/><text class="body" x="54" y="654">Without AI-topic projects</text>
    <circle class="dot" cx="44" cy="674" r="2"/><text class="body" x="54" y="679">One repo per owner</text>
    <circle class="dot" cx="44" cy="699" r="2"/><text class="body" x="54" y="704">README instead of summary</text>
    <rect class="chip-box" x="36" y="778" width="280" height="24" rx="5"/>
    <text class="out-tag" x="46" y="793.5">OUTPUT</text>
    <text class="out" x="96" y="794.5">Does the result hold?</text>
  </g>
</svg>
